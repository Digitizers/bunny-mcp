name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by dependabot-bundle.yml on the commit it pushes: a push made
  # with GITHUB_TOKEN starts no workflow on its own.
  workflow_dispatch:

# Both jobs only read the checkout. Spelling that out keeps the GITHUB_TOKEN
# from carrying whatever the repo default grants (CodeQL flags the omission).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  bundle:
    # The Claude Code plugin runs dist/bundle.mjs, which is committed so a plugin
    # install needs no npm install. A stale bundle would ship old behaviour to
    # every machine silently, so rebuild and fail on any difference.
    #
    # Skipped on Dependabot's own commit, which never carries a rebuilt bundle:
    # dependabot-bundle.yml rebuilds it, pushes, and dispatches this workflow on
    # the new commit, where this job runs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Committed bundle matches the source
        run: git diff --exit-code -- dist/bundle.mjs
